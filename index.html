<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>B-TITAN Registration</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#090909;color:#fff;text-align:center}
.box{max-width:420px;margin:50px auto;padding:30px 20px}
h1{color:#f5c542;font-size:32px}
.card{background:#151515;border:1px solid #444;border-radius:18px;padding:25px}
input,button{width:100%;box-sizing:border-box;padding:15px;margin:10px 0;border-radius:10px;font-size:16px}
input{background:#222;color:#fff;border:1px solid #555}
button{background:#f5c542;color:#000;border:0;font-weight:bold}
button:disabled{opacity:.5}
.info{margin:15px 0;color:#ccc}
#status{margin-top:20px;line-height:1.5}
a{color:#f5c542}
</style>
</head>

<body>
<div class="box">
<h1>⚡ B-TITAN</h1>

<div class="card">
<h2>Registration</h2>

<div class="info">
Referrer ID: <b>10203</b><br>
Registration: <b>0.001 BTCB</b>
</div>

<input id="referrer" value="10203" readonly>

<button id="connect">🔗 Connect Wallet</button>
<button id="register" disabled>🚀 Register Now</button>

<div id="status">Wallet not connected</div>
</div>
</div>

<script>
const BTITAN = "0xD6759d47Fccdef7b8E318479cEC4D128366f2a44";
const BTCB = "0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c";

const REFERRER_ID = 10203;
const AMOUNT = "0.001";

const erc20Abi = [
  "function approve(address spender,uint256 amount) returns(bool)"
];

const btitanAbi = [
  "function registrationExt(uint256 referrerId)"
];

let provider;
let signer;
let account;

const status = document.getElementById("status");
const connectBtn = document.getElementById("connect");
const registerBtn = document.getElementById("register");

function setStatus(msg){
  status.innerHTML = msg;
}

async function connectWallet(){
  try{
    if(!window.ethereum){
      setStatus("❌ Please open this page inside a Web3 wallet browser.");
      return;
    }

    provider = new ethers.BrowserProvider(window.ethereum);

    await provider.send("eth_requestAccounts", []);

    const network = await provider.getNetwork();

    if(network.chainId !== 56n){
      try{
        await window.ethereum.request({
          method:"wallet_switchEthereumChain",
          params:[{chainId:"0x38"}]
        });
      }catch(e){
        setStatus("❌ Please switch your wallet to BNB Smart Chain.");
        return;
      }
    }

    signer = await provider.getSigner();
    account = await signer.getAddress();

    connectBtn.innerText =
      account.slice(0,6) + "..." + account.slice(-4);

    registerBtn.disabled = false;

    setStatus("✅ Wallet connected<br>BNB Smart Chain ready");
  }catch(e){
    setStatus("❌ " + (e.shortMessage || e.message));
  }
}

async function register(){
  try{
    if(!signer){
      await connectWallet();
      if(!signer) return;
    }

    registerBtn.disabled = true;

    setStatus("⏳ Step 1: Approving 0.001 BTCB...");

    const btc = new ethers.Contract(BTCB, erc20Abi, signer);

    const amount = ethers.parseUnits(AMOUNT, 18);

    const approveTx = await btc.approve(BTITAN, amount);

    setStatus("⏳ Waiting for BTCB approval...");

    await approveTx.wait();

    setStatus("✅ Approval confirmed<br>⏳ Step 2: Sending registration...");

    const contract = new ethers.Contract(BTITAN, btitanAbi, signer);

    const tx = await contract.registrationExt(REFERRER_ID);

    setStatus(
      "⏳ Registration transaction submitted...<br>" +
      "<a target='_blank' href='https://bscscan.com/tx/" +
      tx.hash + "'>View Transaction</a>"
    );

    await tx.wait();

    setStatus(
      "🎉 Registration Successful!<br>" +
      "<a target='_blank' href='https://bscscan.com/tx/" +
      tx.hash + "'>View on BscScan</a>"
    );

  }catch(e){
    setStatus("❌ Transaction failed:<br>" +
      (e.shortMessage || e.reason || e.message));
    registerBtn.disabled = false;
  }
}

connectBtn.onclick = connectWallet;
registerBtn.onclick = register;
</script>

</body>
</html>
